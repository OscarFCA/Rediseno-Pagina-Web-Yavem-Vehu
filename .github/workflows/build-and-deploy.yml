name: Build & Deploy to HostGator (cotiza.yabem-vehu.com.mx)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostgator-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (compila JSX + minifica CSS)
        run: node build.mjs

      - name: Clean temp file
        run: rm -f assets/js/_bundle.entry.jsx

      - name: Deploy via FTPS to HostGator
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}
          protocol: ftps
          port: 21
          local-dir: ./
          # Excluye artifacts que no deben subirse al hosting
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/build.mjs
            **/package.json
            **/package-lock.json
            **/email-templates/**
            **/uploads/**
            **/assets/js/_bundle.entry.jsx
            **/assets/js/components.jsx
            **/assets/js/pages.jsx
            **/assets/js/app.jsx
            **/assets/css/styles.css
            **/.gitignore
            **/.DS_Store
            **/SCORING_Leads_Yabem.md
